<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Greeter</title>
  </head>
  <body>
    <form id="form">
      <label>Name <input id="name" name="name" /></label>
      <button>Greet</button>
    </form>
    <p id="greeting" role="status"></p>
    <p id="count"></p>
    <script>
      const form = document.getElementById("form");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const name = document.getElementById("name").value;
        const res = await fetch("/api/greeting?name=" + encodeURIComponent(name));
        const body = await res.json();
        document.getElementById("greeting").textContent = res.ok ? body.greeting : body.error;
        document.getElementById("count").textContent = "";
        if (!res.ok) return;
        const visit = await fetch("/api/visits?name=" + encodeURIComponent(name), { method: "POST" });
        if (!visit.ok) return;
        const seen = await visit.json();
        const times = seen.count === 1 ? "1 time" : seen.count + " times";
        document.getElementById("count").textContent = seen.name + " has been greeted " + times;
      });
    </script>
  </body>
</html>
